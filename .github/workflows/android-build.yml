name: Build and Release MIFARE Programmer APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-build.yml'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.0.0)'
        required: false
        default: 'auto'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
      
    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew
      
    - name: Determine version
      id: version
      run: |
        if [[ "${{ github.event.inputs.release_version }}" != "" && "${{ github.event.inputs.release_version }}" != "auto" ]]; then
          VERSION=${{ github.event.inputs.release_version }}
        elif [[ "${{ github.event_name }}" == "release" ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)
          VERSION="v1.0.${TIMESTAMP}_${SHORT_SHA}"
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Building version: ${VERSION}"

    - name: Check signing configuration
      id: signing_check
      run: |
        cd android-app
        if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" && -n "${{ secrets.KEYSTORE_PASSWORD }}" && -n "${{ secrets.KEY_PASSWORD }}" ]]; then
          echo "✅ Production signing secrets available"
          echo "PRODUCTION_SIGNING=true" >> $GITHUB_ENV
          echo "Using provided keystore from secrets"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/mifare-release-key.jks
        else
          echo "⚠️ Production signing secrets missing - building debug APK only"
          echo "PRODUCTION_SIGNING=false" >> $GITHUB_ENV
          echo "Missing required secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD"
          echo "Development build will be created instead"
        fi

    - name: Setup signing configuration
      run: |
        cd android-app
        cat > gradle.properties << EOF
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.enableJetifier=true
        
        # Signing config
        MIFARE_RELEASE_STORE_FILE=mifare-release-key.jks
        MIFARE_RELEASE_KEY_ALIAS=mifare-key
        MIFARE_RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'mifare123' }}
        MIFARE_RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD || 'mifare123' }}
        EOF

    - name: Update app version
      run: |
        cd android-app/app
        VERSION_CODE=$(date +%s)
        VERSION_NAME="${{ steps.version.outputs.version }}"
        
        sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" build.gradle
        sed -i "s/versionName \".*\"/versionName \"${VERSION_NAME}\"/" build.gradle
        
        echo "Updated to versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME}"
      
    - name: Build Release APK
      if: env.PRODUCTION_SIGNING == 'true'
      run: |
        cd android-app
        echo "Building production-signed release APK..."
        ./gradlew assembleRelease --no-daemon --stacktrace
        
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ Production release APK built successfully"
          echo "APK_TYPE=release" >> $GITHUB_ENV
        else
          echo "❌ Production release APK build failed"
          exit 1
        fi
        
    - name: Build Debug APK
      if: env.PRODUCTION_SIGNING == 'false'
      run: |
        cd android-app
        echo "Building debug APK (no production secrets available)..."
        ./gradlew assembleDebug --no-daemon --stacktrace
        echo "APK_TYPE=debug" >> $GITHUB_ENV
        
    - name: Rename and prepare APK
      run: |
        cd android-app/app/build/outputs/apk
        VERSION="${{ steps.version.outputs.version }}"
        
        if [[ "${{ env.APK_TYPE }}" == "release" ]] && [ -f release/app-release.apk ]; then
          cd release
          mv app-release.apk "mifare-programmer-${VERSION}.apk"
          sha256sum "mifare-programmer-${VERSION}.apk" > "mifare-programmer-${VERSION}.apk.sha256"
          echo "APK_FINAL_PATH=release" >> $GITHUB_ENV
          echo "APK_FINAL_NAME=mifare-programmer-${VERSION}.apk" >> $GITHUB_ENV
        else
          cd debug  
          mv app-debug.apk "mifare-programmer-${VERSION}-debug.apk"
          sha256sum "mifare-programmer-${VERSION}-debug.apk" > "mifare-programmer-${VERSION}-debug.apk.sha256"
          echo "APK_FINAL_PATH=debug" >> $GITHUB_ENV
          echo "APK_FINAL_NAME=mifare-programmer-${VERSION}-debug.apk" >> $GITHUB_ENV
          echo "APK_TYPE=debug" >> $GITHUB_ENV
        fi
        
        echo "✅ APK prepared: ${{ env.APK_FINAL_NAME }}"
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mifare-programmer-apk-${{ steps.version.outputs.version }}
        path: |
          android-app/app/build/outputs/apk/${{ env.APK_TYPE }}/mifare-programmer-*.apk
          android-app/app/build/outputs/apk/${{ env.APK_TYPE }}/mifare-programmer-*.apk.sha256
        retention-days: 90
        
    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PRODUCTION_SIGNING == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: "MIFARE Programmer ${{ steps.version.outputs.version }}"
        body: |
          ## 📱 MIFARE Card Programmer Android App
          
          **Version:** ${{ steps.version.outputs.version }}  
          **Build Type:** ${{ env.APK_TYPE }}  
          **Built:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")  
          **Commit:** ${{ github.sha }}
          
          ### 🚀 Features
          - 🔒 **Enterprise Security**: AES256 encryption, session timeouts
          - 📱 **Dual-Mode Interface**: Simplified user mode + admin mode  
          - 🔑 **7-Click Admin Access**: Hidden admin gesture for security
          - 📡 **NFC Support**: MIFARE Classic 1K/4K programming
          - 🔗 **Backend Integration**: Secure API with access tokens
          - 📊 **Activity Logging**: Admin action tracking with timestamps
          
          ### 📲 Installation
          1. Download `mifare-programmer-${{ steps.version.outputs.version }}.apk`
          2. Enable "Install unknown apps" in Android settings
          3. Install the APK file
          4. **IMPORTANT**: Change default password on first run!
          
          ### 🔐 Security Notes
          - Default admin password: `admin123` - **CHANGE IMMEDIATELY**
          - All data encrypted with AES256-GCM
          - Admin sessions expire after 30 minutes
          - Certificate pinning for HTTPS connections
          
          ### 🎯 Usage
          1. **User Mode**: Automatic card programming with backend programs
          2. **Admin Mode**: 7-click logo → enter password → full features
          3. **Backend URL**: Configure in admin settings to connect to web app
          
          ---
          **Checksum verification available in .sha256 file**
        files: |
          android-app/app/build/outputs/apk/${{ env.APK_TYPE }}/mifare-programmer-*.apk
          android-app/app/build/outputs/apk/${{ env.APK_TYPE }}/mifare-programmer-*.apk.sha256
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}